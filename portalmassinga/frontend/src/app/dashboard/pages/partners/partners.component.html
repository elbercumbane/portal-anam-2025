<div class="page-container">
  <div class="page-header">
    <h1>Parceiros</h1>
    <p>Gerencie o conteúdo da página de parceiros</p>
  </div>

  <div class="page-content">
    <!-- Hero Section -->
    <mat-card class="section-card">
      <mat-card-header>
        <mat-card-title>
          <mat-icon>image</mat-icon>
          Hero Section
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="form-section">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Título</mat-label>
            <input matInput placeholder="Nossos Parceiros">
          </mat-form-field>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Descrição</mat-label>
            <textarea matInput rows="2"></textarea>
          </mat-form-field>
          <div class="image-upload-section">
            <label class="upload-label">Imagem de Fundo</label>
            <div class="image-preview-container">
              <img src="/assets/parceiros.png" alt="Preview" class="image-preview">
              <button mat-raised-button color="primary" class="upload-btn">
                <mat-icon>cloud_upload</mat-icon>
                Alterar Imagem
              </button>
            </div>
          </div>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- Lista de Parceiros -->
    <mat-card class="section-card">
      <mat-card-header>
        <mat-card-title>
          <mat-icon>handshake</mat-icon>
          Parceiros
        </mat-card-title>
        <button mat-icon-button color="primary" class="add-btn">
          <mat-icon>add</mat-icon>
        </button>
      </mat-card-header>
      <mat-card-content>
        <div class="partners-list">
          <mat-expansion-panel *ngFor="let partner of [1,2,3,4]; let i = index">
            <mat-expansion-panel-header>
              <mat-panel-title>Parceiro {{ i + 1 }}</mat-panel-title>
            </mat-expansion-panel-header>
            <div class="form-section">
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Nome</mat-label>
                <input matInput>
              </mat-form-field>
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Descrição</mat-label>
                <textarea matInput rows="3"></textarea>
              </mat-form-field>
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Website</mat-label>
                <input matInput type="url" placeholder="https://">
              </mat-form-field>
              <div class="image-upload-section">
                <label class="upload-label">Logo do Parceiro</label>
                <div class="image-preview-container">
                  <img src="/assets/parceiros.png" alt="Preview" class="image-preview">
                  <button mat-raised-button color="primary" class="upload-btn">
                    <mat-icon>cloud_upload</mat-icon>
                    Alterar Logo
                  </button>
                </div>
              </div>
              <button mat-button color="warn" class="delete-btn">
                <mat-icon>delete</mat-icon>
                Remover Parceiro
              </button>
            </div>
          </mat-expansion-panel>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- Botões de Ação -->
    <div class="action-buttons">
      <button mat-raised-button color="primary" class="save-btn">
        <mat-icon>save</mat-icon>
        Salvar Alterações
      </button>
      <button mat-stroked-button>
        <mat-icon>preview</mat-icon>
        Visualizar Página
      </button>
    </div>
  </div>
</div>
