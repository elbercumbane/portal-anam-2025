<div class="page-container">
  <div class="page-header">
    <h1>Área de Membros</h1>
    <p>Gerencie o conteúdo da página de membros</p>
  </div>

  <div class="page-content">
    <!-- Hero Section -->
    <mat-card class="section-card">
      <mat-card-header>
        <mat-card-title>
          <mat-icon>image</mat-icon>
          Hero Section
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="form-section">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Título</mat-label>
            <input matInput placeholder="Área de Membros">
          </mat-form-field>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Descrição</mat-label>
            <textarea matInput rows="3" placeholder="Descrição da área de membros"></textarea>
          </mat-form-field>
          <div class="image-upload-section">
            <label class="upload-label">Imagem de Fundo</label>
            <div class="image-preview-container">
              <img src="/assets/membros-background.jpg" alt="Preview" class="image-preview">
              <button mat-raised-button color="primary" class="upload-btn">
                <mat-icon>cloud_upload</mat-icon>
                Alterar Imagem
              </button>
            </div>
          </div>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- Seção de Benefícios -->
    <mat-card class="section-card">
      <mat-card-header>
        <mat-card-title>
          <mat-icon>star</mat-icon>
          Benefícios para Membros
        </mat-card-title>
        <button mat-icon-button color="primary" class="add-btn">
          <mat-icon>add</mat-icon>
        </button>
      </mat-card-header>
      <mat-card-content>
        <div class="benefits-list">
          <mat-expansion-panel *ngFor="let benefit of [1,2,3,4]; let i = index">
            <mat-expansion-panel-header>
              <mat-panel-title>Benefício {{ i + 1 }}</mat-panel-title>
            </mat-expansion-panel-header>
            <div class="form-section">
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Ícone (emoji)</mat-label>
                <input matInput placeholder="💼">
              </mat-form-field>
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Título</mat-label>
                <input matInput>
              </mat-form-field>
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Descrição</mat-label>
                <textarea matInput rows="3"></textarea>
              </mat-form-field>
              <button mat-button color="warn" class="delete-btn">
                <mat-icon>delete</mat-icon>
                Remover Benefício
              </button>
            </div>
          </mat-expansion-panel>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- Estatísticas -->
    <mat-card class="section-card">
      <mat-card-header>
        <mat-card-title>
          <mat-icon>analytics</mat-icon>
          Estatísticas de Membros
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="stats-grid">
          <div class="stat-item" *ngFor="let stat of [1,2,3,4]; let i = index">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Valor</mat-label>
              <input matInput placeholder="150+">
            </mat-form-field>
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Label</mat-label>
              <input matInput placeholder="Membros Ativos">
            </mat-form-field>
          </div>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- Botões de Ação -->
    <div class="action-buttons">
      <button mat-raised-button color="primary" class="save-btn">
        <mat-icon>save</mat-icon>
        Salvar Alterações
      </button>
      <button mat-stroked-button>
        <mat-icon>preview</mat-icon>
        Visualizar Página
      </button>
    </div>
  </div>
</div>
