<div class="deactivate-dialog">
  <div class="dialog-header">
    <mat-icon class="header-icon">person_off</mat-icon>
    <h2>Desativar Membro</h2>
    <p>Tem certeza que deseja desativar este membro?</p>
  </div>
  <div class="dialog-body">
    <p><strong>{{ data.memberName }}</strong></p>
    <p class="info-text">O membro não perderá os dados, mas ficará inativo no sistema. Pode ser reativado posteriormente.</p>
  </div>
  <div class="dialog-actions">
    <button mat-button (click)="onCancel()">Cancelar</button>
    <button mat-flat-button (click)="onConfirm()">
      <mat-icon>person_off</mat-icon>
      Desativar
    </button>
  </div>
</div>
