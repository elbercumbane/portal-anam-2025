<div class="approve-dialog">
  <div class="dialog-header">
    <mat-icon class="header-icon success">check_circle</mat-icon>
    <h2>Confirmar Aprovação</h2>
    <p>Tem certeza que deseja aprovar esta candidatura?</p>
  </div>
  <div class="dialog-body">
    <div class="member-info">
      <p><strong>Nome:</strong> {{ data.memberName }}</p>
      <p><strong>Email:</strong> {{ data.memberEmail }}</p>
    </div>
    <p class="info-text">O status será atualizado para "Aprovado" e o membro poderá aceder à área de membros.</p>
  </div>
  <div class="dialog-actions">
    <button mat-button (click)="onCancel()">Cancelar</button>
    <button mat-flat-button color="primary" (click)="onConfirm()">
      <mat-icon>check</mat-icon>
      Confirmar Aprovação
    </button>
  </div>
</div>
