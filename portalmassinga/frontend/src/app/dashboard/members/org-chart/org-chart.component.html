<div class="page-container">
  <div class="page-header">
    <h1>Organograma</h1>
    <p>Gerencie o organograma e estrutura organizacional</p>
  </div>

  <div class="page-content">
    <!-- Hero Section -->
    <mat-card class="section-card">
      <mat-card-header>
        <mat-card-title>
          <mat-icon>image</mat-icon>
          Hero Section
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="form-section">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Título</mat-label>
            <input matInput placeholder="Organograma">
          </mat-form-field>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Descrição</mat-label>
            <textarea matInput rows="3" placeholder="Do presidente às comissões locais, cada ramo sustenta o impacto da Associação"></textarea>
          </mat-form-field>
          <div class="image-upload-section">
            <label class="upload-label">Imagem de Fundo</label>
            <div class="image-preview-container">
              <img src="/assets/membros-background.jpg" alt="Preview" class="image-preview">
              <button mat-raised-button color="primary" class="upload-btn">
                <mat-icon>cloud_upload</mat-icon>
                Alterar Imagem
              </button>
            </div>
          </div>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- Estrutura Organizacional -->
    <mat-card class="section-card">
      <mat-card-header>
        <mat-card-title>
          <mat-icon>account_tree</mat-icon>
          Estrutura Organizacional
        </mat-card-title>
        <button mat-icon-button color="primary" class="add-btn">
          <mat-icon>add</mat-icon>
        </button>
      </mat-card-header>
      <mat-card-content>
        <div class="structure-list">
          <mat-expansion-panel *ngFor="let position of [1,2,3,4]; let i = index">
            <mat-expansion-panel-header>
              <mat-panel-title>Posição {{ i + 1 }}</mat-panel-title>
            </mat-expansion-panel-header>
            <div class="form-section">
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Cargo/Título</mat-label>
                <input matInput placeholder="Ex: Presidente">
              </mat-form-field>
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Nome</mat-label>
                <input matInput placeholder="Nome completo">
              </mat-form-field>
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Tag/Categoria</mat-label>
                <input matInput placeholder="Ex: Presidência">
              </mat-form-field>
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Email de Contato</mat-label>
                <input matInput type="email" placeholder="email@anam.org">
              </mat-form-field>
              <mat-form-field appearance="outline">
                <mat-label>Nível Hierárquico</mat-label>
                <mat-select>
                  <mat-option value="presidente">Presidente</mat-option>
                  <mat-option value="vice">Vice-Presidente</mat-option>
                  <mat-option value="conselho">Conselho</mat-option>
                  <mat-option value="comissao">Comissão</mat-option>
                </mat-select>
              </mat-form-field>
              <div class="image-upload-section">
                <label class="upload-label">Foto (opcional)</label>
                <div class="image-preview-container">
                  <img src="/assets/FOTO1 ANAM.jpeg" alt="Preview" class="image-preview">
                  <button mat-raised-button color="primary" class="upload-btn">
                    <mat-icon>cloud_upload</mat-icon>
                    Alterar Foto
                  </button>
                </div>
              </div>
              <button mat-button color="warn" class="delete-btn">
                <mat-icon>delete</mat-icon>
                Remover Posição
              </button>
            </div>
          </mat-expansion-panel>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- Botões de Ação -->
    <div class="action-buttons">
      <button mat-raised-button color="primary" class="save-btn">
        <mat-icon>save</mat-icon>
        Salvar Alterações
      </button>
      <button mat-stroked-button>
        <mat-icon>preview</mat-icon>
        Visualizar Página
      </button>
    </div>
  </div>
</div>
