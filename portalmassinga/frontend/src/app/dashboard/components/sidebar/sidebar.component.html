<div class="sidebar-content">
  <div class="sidebar-brand">
    <span class="brand-name">ANAM</span>
    <span class="brand-desc">Associação de Naturais e Amigos de Massinga</span>
  </div>
  <div class="sidebar-header" *ngIf="isHandset">
    <button mat-icon-button (click)="onToggleSidebar()" class="close-btn">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <app-user-info
    [userInfo]="userInfo">
  </app-user-info>

  <app-navigation 
    [navigationItems]="navigationItems"
    [activeItem]="activeNavigationItem"
    [pendingMembersCount]="pendingMembersCount"
    (navigationClick)="onNavigationClick($event)"
    (serviceItemClick)="onServiceItemClick($event)">
  </app-navigation>
</div>
