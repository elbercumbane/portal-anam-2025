<div class="dashboard-header-card">
  <div class="header-bg-pattern"></div>
  <div class="header-content">
    <div class="greeting-section">
      <div class="greeting-icon">
        <mat-icon>waving_hand</mat-icon>
      </div>
      <div class="greeting-text">
        <h2 class="greeting-title">
          <span class="greeting-label">{{ greeting }},</span>
          <span class="user-name">{{ userName }}!</span>
        </h2>
        <p class="welcome-message">
          Bem-vindo ao Dashboard da ANAM — Associação de Naturais e Amigos de Massinga.
        </p>
      </div>
    </div>

    <div class="header-meta">
      <div class="meta-chip">
        <mat-icon>verified</mat-icon>
        <span>Sistema activo</span>
      </div>
      <div class="quick-actions">
        <button mat-icon-button class="action-btn" matTooltip="Actualizar dados">
          <mat-icon>refresh</mat-icon>
        </button>
        <button mat-icon-button class="action-btn" matTooltip="Configurações">
          <mat-icon>settings</mat-icon>
        </button>
        <button mat-icon-button class="action-btn" matTooltip="Ajuda">
          <mat-icon>help_outline</mat-icon>
        </button>
      </div>
    </div>
  </div>
</div>
