<div class="user-help-modal-overlay"
     *ngIf="isVisible"
     [class.user-help-modal-visible]="isVisible"
     (click)="onOverlayClick($event)">

  <div class="user-help-modal-container"
       [class.user-help-modal-visible]="isVisible">

    <div class="user-help-modal-header">
      <div class="user-help-modal-icon">
        <mat-icon>person_outline</mat-icon>
      </div>
      <div class="user-help-modal-header-text">
        <h3 class="user-help-modal-title">Guia rápido do Utilizador</h3>
        <p class="user-help-modal-subtitle">Selecione uma categoria para ver orientações resumidas.</p>
      </div>
      <button class="user-help-modal-close" (click)="close()" title="Fechar">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="user-help-modal-body">
      <div class="user-help-modal-layout">
        <nav class="user-help-modal-nav">
          <button
            type="button"
            class="nav-item"
            *ngFor="let section of sections"
            (click)="selectSection(section.id)"
            [class.active]="isActive(section.id)">
            <div class="nav-item-icon">
              <mat-icon>{{ section.icon }}</mat-icon>
          </div>
            <div class="nav-item-text">
              <span class="nav-item-title">{{ section.title }}</span>
              <span class="nav-item-summary">{{ section.summary }}</span>
          </div>
            <mat-icon class="nav-item-arrow">chevron_right</mat-icon>
          </button>
        </nav>

        <section class="user-help-modal-content" *ngIf="activeSection as section">
          <header class="content-header">
            <div class="content-header-icon">
              <mat-icon>{{ section.icon }}</mat-icon>
          </div>
            <div class="content-header-text">
              <h4>{{ section.title }}</h4>
              <p>{{ section.description }}</p>
          </div>
          </header>

          <div class="help-item" *ngFor="let item of section.items">
            <strong>{{ item.title }}</strong>
            <p>{{ item.content }}</p>
          </div>

          <ul class="tips-list" *ngIf="section.tips?.length">
            <li *ngFor="let tip of section.tips">
              <mat-icon>lightbulb</mat-icon>
              <span>{{ tip }}</span>
            </li>
          </ul>
        </section>
      </div>
    </div>

    <div class="user-help-modal-footer">
      <button type="button"
              class="user-help-modal-btn user-help-modal-btn-close"
              (click)="close()">
        <mat-icon>check</mat-icon>
        Entendi
      </button>
    </div>
  </div>
</div>
