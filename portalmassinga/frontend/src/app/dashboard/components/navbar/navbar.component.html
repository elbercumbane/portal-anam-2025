<mat-toolbar class="top-navbar">
  <div class="navbar-left">
    <app-navbar-menu-button *ngIf="!isHandset || !sidebarOpen" (toggleSidebar)="onToggleSidebar()"></app-navbar-menu-button>

    <div class="navbar-brand">
      <div class="brand-row">
        <span class="brand-acronym">ANAM</span>
        <span class="brand-badge">Painel Admin</span>
      </div>
      <span class="brand-subtitle">{{ subtitle }}</span>
    </div>
  </div>

  <div class="navbar-center">
    <app-navbar-search (search)="onSearch($event)"></app-navbar-search>
  </div>

  <div class="navbar-right">
    <app-navbar-clock></app-navbar-clock>

    <div class="navbar-divider"></div>

    <app-navbar-actions>
      <button
        mat-icon-button
        class="action-btn refresh-btn"
        matTooltip="Actualizar dashboard"
        (click)="onRefreshDashboard()">
        <mat-icon>refresh</mat-icon>
      </button>

      <app-navbar-notifications
        [notificationCount]="notificationCount"
        (notificationsClick)="onNotificationsClick()">
      </app-navbar-notifications>

      <div class="action-divider"></div>

      <app-navbar-user-profile
        [userName]="userName"
        [userRole]="userRole"
        [userEmail]="userEmail"
        (profileOptionClick)="onProfileOptionClick($event)">
      </app-navbar-user-profile>
    </app-navbar-actions>
  </div>
</mat-toolbar>
