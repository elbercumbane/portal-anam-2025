<div class="change-password-dialog">
  <div class="dialog-header">
    <mat-icon class="header-icon primary">lock_reset</mat-icon>
    <h2>Definir nova senha</h2>
    <p>Para sua segurança, defina uma nova senha no primeiro acesso.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="dialog-content">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nova senha</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="newPassword" minlength="6">
        <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="form.get('newPassword')?.hasError('required')">Campo obrigatório</mat-error>
        <mat-error *ngIf="form.get('newPassword')?.hasError('minlength')">Mínimo 6 caracteres</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Confirmar senha</mat-label>
        <input matInput [type]="hideConfirm ? 'password' : 'text'" formControlName="confirmPassword">
        <button mat-icon-button matSuffix type="button" (click)="hideConfirm = !hideConfirm">
          <mat-icon>{{ hideConfirm ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="form.get('confirmPassword')?.hasError('required')">Campo obrigatório</mat-error>
        <mat-error *ngIf="form.hasError('mismatch') && form.get('confirmPassword')?.touched">As senhas não coincidem</mat-error>
      </mat-form-field>

      <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
    </div>

    <div class="dialog-actions">
      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || isLoading">
        {{ isLoading ? 'A alterar...' : 'Confirmar' }}
      </button>
    </div>
  </form>
</div>
