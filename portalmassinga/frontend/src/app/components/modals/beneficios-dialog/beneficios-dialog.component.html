<div class="dialog-container">
  <div class="dialog-header">
    <mat-icon>stars</mat-icon>
    <h2>Benefícios de membro</h2>
    <button mat-icon-button (click)="onClose()" class="close-button" type="button">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-body">
    <p class="intro">Pagar cotas mantém a sua associação activa e dá-lhe acesso a:</p>
    <ul class="benefits-simple">
      <li><mat-icon>how_to_vote</mat-icon> Voz nas decisões da ANAM</li>
      <li><mat-icon>event</mat-icon> Eventos e formações exclusivas</li>
      <li><mat-icon>groups</mat-icon> Rede de contactos profissionais</li>
      <li><mat-icon>receipt_long</mat-icon> Recibos oficiais de pagamento</li>
    </ul>
  </div>

  <div class="dialog-actions">
    <button mat-raised-button color="primary" type="button" (click)="onClose()">Entendi</button>
  </div>
</div>
