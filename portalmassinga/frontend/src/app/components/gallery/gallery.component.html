<!-- Seção Galeria Moderna -->
<section class="galeria-section" id="galeria" #galeriaSection>
  <div class="container">
    <!-- Header da Galeria -->
    <div class="galeria-header">
      <h1 class="galeria-title">
        <span class="title-part-1">Galeria</span>
      </h1>
    </div>

    <!-- Lista de Eventos - 4 eventos com foto e título -->
    <div class="eventos-container">
      <article 
        class="evento-card" 
        *ngFor="let evento of getEventosPreview(); let i = index; trackBy: trackByEventoId"
        (click)="abrirEvento(evento)">
        
        <!-- Foto do Evento (slide sequencial e suave, um card de cada vez) -->
        <div class="evento-foto-container">
          <img 
            [src]="evento.fotos[getCardPhotoIndex(i)]?.src" 
            [alt]="evento.titulo"
            class="evento-foto"
            [class.evento-foto-loaded]="isCardImageLoaded(i)"
            (load)="onCardImageLoad(i)"
            loading="lazy">
          <div class="evento-overlay">
            <div class="evento-conteudo">
              <h2 class="evento-titulo">{{ evento.titulo }}</h2>
              <span class="evento-data">{{ evento.data }}</span>
            </div>
            <div class="evento-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"></path>
                <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
              <span>{{ evento.fotos.length }}</span>
            </div>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>

<!-- Modal do Evento -->
<div class="modal-overlay" *ngIf="modalAberto" (click)="fecharModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-header-content">
        <h2>{{ eventoSelecionado?.titulo }}</h2>
        <span class="modal-data">{{ eventoSelecionado?.data }}</span>
      </div>
      <button class="close-btn" (click)="fecharModal()">×</button>
    </div>
    
    <div class="modal-body">
      <div class="fotos-container">
        <div class="foto-principal">
          <img [src]="eventoSelecionado?.fotos[fotoAtual]?.src" 
               [alt]="eventoSelecionado?.fotos[fotoAtual]?.alt"
               class="foto-slider">
          
          <div class="foto-navigation">
            <button class="nav-btn prev" (click)="fotoAnterior()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </button>
            <button class="nav-btn next" (click)="proximaFoto()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>
          
          <!-- Indicadores de progresso -->
          <div class="foto-indicators">
            <div 
              *ngFor="let foto of eventoSelecionado?.fotos; let i = index"
              class="indicator"
              [class.active]="i === fotoAtual"
              (click)="selecionarFoto(i)">
              <div class="indicator-progress" *ngIf="i === fotoAtual"></div>
            </div>
          </div>
          
          <div class="foto-counter">
            <svg class="counter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            {{ fotoAtual + 1 }} / {{ eventoSelecionado?.fotos.length }}
          </div>
          
          <div class="foto-descricao">
            <svg class="desc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            {{ eventoSelecionado?.fotos[fotoAtual]?.alt }}
          </div>
        </div>
        
        <div class="fotos-thumbnails">
          <div class="thumbnail" 
               *ngFor="let foto of eventoSelecionado?.fotos; let i = index"
               [class.active]="i === fotoAtual"
               (click)="selecionarFoto(i)">
            <img [src]="foto.src" [alt]="foto.alt">
            <div class="thumbnail-descricao">
              {{ foto.alt }}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
