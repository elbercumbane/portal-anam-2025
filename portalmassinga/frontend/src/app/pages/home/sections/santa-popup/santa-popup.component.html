<div class="santa-popup" *ngIf="isVisible" [class.visible]="isVisible" [class.show-message]="showMessage">
  <div class="santa-container">
    <div class="santa-character">
      <!-- Papai Noel SVG -->
      <svg viewBox="0 0 200 200" class="santa-svg">
        <!-- Corpo do Papai Noel -->
        <circle cx="100" cy="120" r="40" fill="#C41E3A" class="santa-body"/>
        <circle cx="100" cy="80" r="30" fill="#FFE5B4" class="santa-face"/>
        
        <!-- Chapéu -->
        <path d="M 70 50 L 100 30 L 130 50 L 125 80 L 75 80 Z" fill="#C41E3A" class="santa-hat"/>
        <circle cx="100" cy="30" r="8" fill="#FFFFFF" class="hat-pom"/>
        
        <!-- Olhos -->
        <circle cx="92" cy="75" r="3" fill="#000000"/>
        <circle cx="108" cy="75" r="3" fill="#000000"/>
        
        <!-- Nariz -->
        <circle cx="100" cy="82" r="2" fill="#FF6B6B"/>
        
        <!-- Boca (sorriso) -->
        <path d="M 92 88 Q 100 92 108 88" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round"/>
        
        <!-- Barba -->
        <path d="M 75 80 Q 100 110 125 80" fill="#FFFFFF" class="santa-beard"/>
        
        <!-- Braços -->
        <ellipse cx="70" cy="110" rx="8" ry="25" fill="#C41E3A" transform="rotate(-20 70 110)"/>
        <ellipse cx="130" cy="110" rx="8" ry="25" fill="#C41E3A" transform="rotate(20 130 110)"/>
        
        <!-- Mãos acenando -->
        <circle cx="65" cy="95" r="6" fill="#FFE5B4"/>
        <circle cx="135" cy="95" r="6" fill="#FFE5B4"/>
      </svg>
    </div>
    
    <div class="message-bubble" *ngIf="showMessage">
      <p [innerHTML]="message"></p>
    </div>
  </div>
</div>
