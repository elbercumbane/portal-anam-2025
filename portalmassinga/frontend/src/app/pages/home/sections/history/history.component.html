<section class="historial" aria-labelledby="hist-title">
  <div class="container">
    <!-- Seção Completa - Missão, Valores e Visão -->
    <div class="mission-values-vision-wrapper">
      <div class="mission-values-container">
        <!-- Coluna Esquerda: Missão e Visão -->
        <div class="mission-visions-column">
          <div class="mission-header">
            <h2 class="section-main-title" [innerHTML]="sobreAnam.titulo"></h2>
            <p class="mission-intro" [innerHTML]="sobreAnam.introducao">
            </p>
            
            <!-- Missão -->
            <div class="mission-item">
              <div class="mission-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                  <path d="M2 17l10 5 10-5"/>
                  <path d="M2 12l10 5 10-5"/>
                </svg>
              </div>
              <div class="mission-content">
                <h3 [innerHTML]="missao.titulo"></h3>
                <p [innerHTML]="missao.descricao"></p>
              </div>
            </div>
            
            <!-- Visão -->
            <div class="mission-item">
              <div class="mission-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </div>
              <div class="mission-content">
                <h3 [innerHTML]="visao.titulo"></h3>
                <p [innerHTML]="visao.descricao"></p>
              </div>
            </div>
          </div>
        </div>

        <!-- Coluna Direita: Valores -->
        <div class="values-column">
          <h3 class="values-section-title" [innerHTML]="valores.titulo"></h3>
          <div class="values-list">
            <!-- Valores carregados da base de dados -->
            <div class="value-item" *ngFor="let valor of valores.valores; let i = index">
              <div class="value-icon">
                <svg *ngIf="i === 0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                  <circle cx="9" cy="7" r="4"/>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                <svg *ngIf="i === 1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                  <circle cx="9" cy="7" r="4"/>
                  <line x1="19" y1="8" x2="19" y2="14"/>
                  <line x1="22" y1="11" x2="16" y2="11"/>
                </svg>
                <svg *ngIf="i === 2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <polyline points="12 6 12 12 16 14"/>
                </svg>
              </div>
              <div class="value-content">
                <h4 [innerHTML]="valor.titulo"></h4>
                <p [innerHTML]="valor.descricao"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
