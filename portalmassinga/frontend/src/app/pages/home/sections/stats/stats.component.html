<section class="stats-section" id="estatisticas" aria-labelledby="stats-title">
  <div class="container">
    <!-- Header -->
    <div class="stats-header">
      <span class="section-badge">Impacto</span>
      <h2 id="stats-title" class="section-title">
        Números que <span class="highlight">Importam</span>
      </h2>
      <p class="section-subtitle">
        Conheça o impacto da nossa associação na comunidade de Massinga
      </p>
    </div>
    
    <!-- Stats Grid -->
    <div class="stats-grid">
      <article class="stat-card" *ngFor="let stat of stats; let i = index" [attr.data-index]="i">
        <!-- Decoração de fundo -->
        <div class="stat-decoration" [style.background]="getDecorationGradient(stat.color)"></div>
        
        <!-- Ícone com gradiente -->
        <div class="stat-icon-wrapper" [style.background]="getIconGradient(stat.color)">
          <div class="stat-icon-bg" [style.background-color]="stat.bgColor"></div>
          <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <ng-container *ngIf="stat.icon === 'people'">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </ng-container>
            <ng-container *ngIf="stat.icon === 'assignment'">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </ng-container>
            <ng-container *ngIf="stat.icon === 'location_on'">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </ng-container>
            <ng-container *ngIf="stat.icon === 'handshake'">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              <line x1="12" y1="12" x2="12" y2="16"></line>
              <line x1="8" y1="14" x2="16" y2="14"></line>
            </ng-container>
          </svg>
        </div>
        
        <!-- Conteúdo -->
        <div class="stat-content">
          <div class="stat-number" [style.color]="stat.color">{{ stat.number }}</div>
          <div class="stat-label">{{ stat.label }}</div>
        </div>
        
        <!-- Elemento decorativo inferior -->
        <div class="stat-accent" [style.background-color]="stat.color"></div>
      </article>
    </div>
  </div>
</section>
