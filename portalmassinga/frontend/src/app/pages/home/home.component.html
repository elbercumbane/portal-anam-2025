<!-- Hero Section - Novo Layout Simples -->
<section class="hero-section" aria-labelledby="hero-title" *ngIf="!isLoading">
  <!-- Efeito de Neve (condicional) -->
  <div class="snow-container" *ngIf="enableSnow && snowflakes.length > 0" style="position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: 100; pointer-events: none; overflow: visible;">
    <div class="snowflake" 
         *ngFor="let flake of snowflakes; let i = index"
         [style.left.%]="getSnowflakePosition(i)"
         [style.animation-delay.s]="getSnowflakeDelay(i)"
         [style.animation-duration.s]="getSnowflakeDuration(i)"></div>
  </div>
  
  <!-- Papai Noel (condicional) -->
  <app-santa-popup *ngIf="enableSanta" [message]="christmasMessage"></app-santa-popup>
  
  <div class="hero-background">
    <div class="hero-slider">
      <div class="hero-slide" 
           *ngFor="let slide of slides; let i = index"
           [class.active]="currentSlide === i"
           [style.background-image]="'url(' + slide.imagem + ')'">
      </div>
    </div>
    <div class="hero-overlay" 
         [class.overlay-yellow-soft]="currentSlide === 0"
         [class.overlay-red-soft]="currentSlide === 1"
         [class.overlay-yellow]="currentSlide === 2"
         [class.overlay-red-soft]="currentSlide === 3"></div>
  </div>
  
  <div class="hero-container" [class.transitioning]="isTransitioning">
    <div class="hero-badge" *ngIf="currentSlide === 0">Bem-vindo</div>
    <div class="hero-badge" *ngIf="currentSlide === 1">Missão</div>
    <div class="hero-badge" *ngIf="currentSlide === 2">Visão</div>
    <div class="hero-badge" *ngIf="currentSlide === 3">Valores</div>
    
    <h1 id="hero-title" class="hero-title">
      <span class="hero-title-text" [innerHTML]="getCurrentTitle()"></span>
    </h1>
    
    <p class="hero-subtitle" [innerHTML]="getCurrentSubtitle()"></p>
    
    <div class="hero-actions">
      <a [routerLink]="getCurrentButton().link" 
         class="hero-cta-button"
         [style.background-color]="getCurrentButton().color">
        {{ getCurrentButton().text }}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    </div>
  </div>
  
  <!-- Controles do Slider -->
  <div class="hero-controls">
    <button 
      *ngFor="let slide of slides; let i = index"
      class="hero-dot" 
      [class.active]="currentSlide === i"
      (click)="goToSlide(i)"
      [attr.aria-label]="'Slide ' + (i + 1)">
    </button>
  </div>
</section>

<!-- Loading State -->
<div *ngIf="isLoading" class="hero-loading" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
  <div style="text-align: center; color: white;">
    <div style="font-size: 24px; margin-bottom: 16px;">Carregando conteúdo...</div>
    <div style="font-size: 14px; opacity: 0.8;">A carregar da base de dados</div>
  </div>
</div>
