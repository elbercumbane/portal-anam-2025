# Configuração da Aplicação Spring Boot
spring.application.name=portal-anam-backend

# Configuração do Servidor
server.port=8080
server.servlet.context-path=/api

# Configuração do Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/anam2025
spring.datasource.username=postgres
spring.datasource.password=santos133
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# Configuração JPA/Hibernate
# Usar 'update' temporariamente para criar a tabela home_content se não existir
# Depois pode voltar para 'validate'
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# Desabilitar criação automática de tabelas - usar apenas as tabelas existentes
spring.jpa.properties.hibernate.hbm2ddl.auto=validate

# Configuração de CORS
spring.web.cors.allowed-origins=http://localhost:4200,http://localhost:4201
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Encoding
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.anam=DEBUG
logging.level.com.anam.controller=DEBUG
logging.level.com.anam.repository=DEBUG

# SpringDoc OpenAPI (Swagger)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Desabilitar recursos estáticos automáticos para evitar conflito com rotas da API
spring.web.resources.add-mappings=false

