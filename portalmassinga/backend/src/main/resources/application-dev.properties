# Configuração de Desenvolvimento com H2 Database (Rápido, sem instalação)
# Use este profile quando PostgreSQL não estiver instalado

# Configuração do Banco de Dados H2 (em arquivo)
spring.datasource.url=jdbc:h2:file:./data/anam;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração JPA/Hibernate para H2
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.hbm2ddl.auto=update

# H2 Console (para visualizar dados)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Criar diretório de dados se não existir
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
