<div class="fae-help-modal-overlay" 
     *ngIf="isVisible" 
     [class.fae-help-modal-visible]="isVisible"
     (click)="onOverlayClick($event)">
  
  <div class="fae-help-modal-container" 
       [class.fae-help-modal-visible]="isVisible">
    
    <div class="fae-help-modal-header">
      <div class="fae-help-modal-icon">
        <mat-icon>help_outline</mat-icon>
      </div>
      <div class="fae-help-modal-header-text">
        <h3 class="fae-help-modal-title">Como usar os recursos do FAE</h3>
        <p class="fae-help-modal-subtitle">Clique em uma categoria para ver dicas rápidas e detalhadas.</p>
      </div>
      <button class="fae-help-modal-close" (click)="close()" title="Fechar">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    
    <div class="fae-help-modal-body">
      <div class="fae-help-modal-layout">
        <nav class="fae-help-modal-nav">
          <button
            type="button"
            class="nav-item"
            *ngFor="let section of sections"
            (click)="selectSection(section.id)"
            [class.active]="isActive(section.id)">
            <div class="nav-item-icon">
              <mat-icon>{{ section.icon }}</mat-icon>
          </div>
            <div class="nav-item-text">
              <span class="nav-item-title">{{ section.title }}</span>
              <span class="nav-item-summary">{{ section.summary }}</span>
          </div>
            <mat-icon class="nav-item-arrow">chevron_right</mat-icon>
          </button>
        </nav>

        <section class="fae-help-modal-content" *ngIf="activeSection as section">
          <header class="content-header">
            <div class="content-header-icon">
              <mat-icon>{{ section.icon }}</mat-icon>
          </div>
            <div class="content-header-text">
              <h4>{{ section.title }}</h4>
              <p>{{ section.description }}</p>
          </div>
          </header>
          
          <div class="help-item" *ngFor="let item of section.items">
            <strong>{{ item.title }}</strong>
            <p>{{ item.content }}</p>
          </div>
          
          <ul class="tips-list" *ngIf="section.tips?.length">
            <li *ngFor="let tip of section.tips">
              <mat-icon>lightbulb</mat-icon>
              <span>{{ tip }}</span>
            </li>
          </ul>
        </section>
      </div>
    </div>
    
    <div class="fae-help-modal-footer">
      <button type="button" 
              class="fae-help-modal-btn fae-help-modal-btn-close"
              (click)="close()">
        <mat-icon>check</mat-icon>
        Entendi
      </button>
    </div>
  </div>
</div>
