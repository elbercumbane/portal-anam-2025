<!-- Hero Editorial -->
<section class="projectos-hero">
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <span class="hero-edition">Nossos Projectos</span>
    <h1 class="hero-title">
      Transformando <span class="highlight">Vidas</span>
    </h1>
    <p class="hero-subtitle">Projectos que fazem a diferença na comunidade de Massinga</p>
    <div class="hero-meta">
      <span class="meta-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
          <path d="M2 17l10 5 10-5"></path>
          <path d="M2 12l10 5 10-5"></path>
        </svg>
        Desenvolvimento Sustentável
      </span>
      <span class="meta-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        Massinga, Moçambique
      </span>
    </div>
    <div class="hero-tabs">
      <nav class="tabs-nav">
        <a routerLink="/projectos/ativos" 
           routerLinkActive="active" 
           [routerLinkActiveOptions]="{exact: false}"
           class="tab-link"
           (click)="navigateTo('ativos', $event)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
          <span>Projectos Activos</span>
        </a>
        <a routerLink="/projectos/realizados" 
           routerLinkActive="active" 
           class="tab-link"
           (click)="navigateTo('realizados', $event)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Projectos Realizados</span>
        </a>
        <a routerLink="/projectos/candidaturas" 
           routerLinkActive="active" 
           class="tab-link"
           (click)="navigateTo('candidaturas', $event)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
          <span>Candidaturas</span>
        </a>
      </nav>
    </div>
  </div>
  <div class="hero-scroll-indicator">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <polyline points="19 12 12 19 5 12"></polyline>
    </svg>
  </div>
</section>

<!-- Estatísticas em Destaque -->
<section class="stats-highlight">
  <div class="container">
    <div class="stats-grid">
      <div class="stat-item" *ngFor="let stat of estatisticas; let i = index" [attr.data-index]="i">
        <div class="stat-icon-wrapper">
          <!-- Ícone Check Circle -->
          <svg *ngIf="stat.icon === 'check-circle'" class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
          <!-- Ícone Rocket -->
          <svg *ngIf="stat.icon === 'rocket'" class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path>
            <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path>
            <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"></path>
            <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"></path>
          </svg>
          <!-- Ícone Dollar Sign -->
          <svg *ngIf="stat.icon === 'dollar-sign'" class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23"></line>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
          <!-- Ícone Heart -->
          <svg *ngIf="stat.icon === 'heart'" class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
        </div>
        <h3 class="stat-valor">{{ stat.valor }}</h3>
        <p class="stat-label">{{ stat.label }}</p>
      </div>
    </div>
  </div>
</section>

<!-- Conteúdo dos Projectos -->
<section class="projectos-container">
  <div class="container">
    <div class="projectos-content">
  <router-outlet></router-outlet>
    </div>
  </div>
</section>

<button class="scroll-top-btn" [class.at-top]="isAtTop" (click)="handleScrollButton()" aria-label="Navegação scroll">
  <svg *ngIf="!isAtTop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <polyline points="18 15 12 9 6 15"></polyline>
  </svg>
  <svg *ngIf="isAtTop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <polyline points="6 9 12 15 18 9"></polyline>
  </svg>
</button>
