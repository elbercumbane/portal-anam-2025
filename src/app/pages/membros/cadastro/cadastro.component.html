<section class="container">
  <h1>Cadastro de Membro</h1>
  <p class="lead">Preencha o formulário abaixo para se candidatar a membro da nossa associação.</p>
  
  <form class="cadastro-form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="nome">Nome Completo *</label>
      <input type="text" id="nome" name="nome" [(ngModel)]="formData.nome" required>
    </div>
    
    <div class="form-group">
      <label for="email">Email *</label>
      <input type="email" id="email" name="email" [(ngModel)]="formData.email" required>
    </div>
    
    <div class="form-group">
      <label for="empresa">Empresa/Organização</label>
      <input type="text" id="empresa" name="empresa" [(ngModel)]="formData.empresa">
    </div>
    
    <div class="form-group">
      <label for="telefone">Telefone *</label>
      <input type="tel" id="telefone" name="telefone" [(ngModel)]="formData.telefone" required>
    </div>
    
    <div class="form-group">
      <label for="nuit">NUIT (Número de Identificação Único de Contribuinte)</label>
      <input type="text" id="nuit" name="nuit" [(ngModel)]="formData.nuit">
    </div>
    
    <div class="form-group">
      <label for="mensagem">Mensagem Adicional</label>
      <textarea id="mensagem" name="mensagem" rows="4" [(ngModel)]="formData.mensagem" 
                placeholder="Conte-nos mais sobre si e o seu interesse em fazer parte da associação..."></textarea>
    </div>
    
    <div class="form-actions">
      <button type="button" class="btn btn-secondary" routerLink="/membros">Cancelar</button>
      <button type="submit" class="btn" [disabled]="!formData.nome || !formData.email || !formData.telefone">
        Enviar Candidatura
      </button>
    </div>
  </form>
</section>
